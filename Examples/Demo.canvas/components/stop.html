<style>
  :host { display: block; }
  .stop { display: grid; grid-template-columns: 52px 18px 1fr; column-gap: 12px; }
  time { padding-top: 2px; font: 600 13px/1.3 var(--font-sans); color: var(--color-muted); font-variant-numeric: tabular-nums; }
  .rail { position: relative; display: flex; justify-content: center; }
  .rail::after { content: ""; position: absolute; top: 20px; bottom: -6px; width: 2px; border-radius: 1px; background: var(--color-line); }
  :host(:last-child) .rail::after { display: none; }
  .dot { position: relative; z-index: 1; width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; border: 2px solid var(--color-line); background: var(--color-surface); }
  .done .dot { background: var(--color-muted); border-color: var(--color-muted); }
  .done h4, .done p { opacity: 0.55; }
  .now .dot { background: var(--color-accent); border-color: var(--color-accent); }
  .now .dot::before {
    content: ""; position: absolute; inset: -6px; border-radius: 50%; background: var(--color-accent);
    opacity: 0.35; animation: ping 2s var(--ease-out) infinite;
  }
  @keyframes ping { from { transform: scale(0.5); opacity: 0.45; } to { transform: scale(1.6); opacity: 0; } }
  .content { padding-bottom: 22px; }
  h4 { margin: 0; font: 600 16px/1.3 var(--font-sans); letter-spacing: -0.01em; color: var(--color-fg); }
  p { margin: 3px 0 0; font: 400 14px/1.4 var(--font-sans); color: var(--color-muted); }
  ::slotted(*) { display: inline-flex; margin-top: 10px; }
  @media (prefers-reduced-motion: reduce) { .now .dot::before { animation: none; } }
</style>
<div class="stop {{state|next}}">
  <time>{{time}}</time>
  <div class="rail"><span class="dot"></span></div>
  <div class="content">
    <h4>{{title}}</h4>
    <p>{{detail}}</p>
    <slot></slot>
  </div>
</div>
