<style>
  :host { display: block; }
  .card {
    height: 100%; display: flex; flex-direction: column; overflow: hidden;
    background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
  }
  .art {
    position: relative; flex: 1; min-height: 120px; overflow: hidden;
    background: linear-gradient(170deg, var(--from, #9ec3e6), var(--to, #f2c3a8));
  }
  /* Two soft ridges and a sun: a quiet landscape in each trip's colours. */
  .art::before, .art::after { content: ""; position: absolute; left: -10%; right: -10%; border-radius: 50% 50% 0 0; }
  .art::before { bottom: -38%; height: 70%; background: var(--ridge, rgba(255, 255, 255, 0.28)); transform: rotate(-4deg); }
  .art::after { bottom: -52%; height: 74%; background: var(--ridge-near, rgba(0, 0, 0, 0.12)); transform: rotate(5deg); }
  .sun {
    position: absolute; top: 22%; right: 18%; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.75); box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.12);
  }
  .tag { position: absolute; top: 16px; left: 16px; z-index: 1; }
  .body { padding: 18px 20px 20px; display: grid; gap: 6px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h3 { margin: 0; font: 650 19px/1.2 var(--font-sans); letter-spacing: -0.02em; color: var(--color-fg); }
  .nights { font: 500 13px/1 var(--font-sans); color: var(--color-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  p { margin: 0; font: 400 14px/1.4 var(--font-sans); color: var(--color-muted); }
</style>
<article class="card">
  <div class="art"><div class="sun"></div><div class="tag"><slot name="tag"></slot></div></div>
  <div class="body">
    <div class="row"><h3>{{place}}</h3><span class="nights">{{nights|3}} nights</span></div>
    <p>{{country}}, {{dates}}</p>
  </div>
</article>
